[package]
name = "cuda_rustc"
version = "0.1.0"
edition = "2024"

[lib]
name = "cuda_rustc"
path = "src/lib.rs"

[[bin]]
name = "cuda_rustc"
path = "src/main.rs"

[[bin]]
name = "cuda_clippy"
path = "src/bin/cuda_clippy.rs"

[[bin]]
name = "cuda_rustfmt"
path = "src/bin/cuda_rustfmt.rs"

[[bin]]
name = "cuda_rust_analyzer"
path = "src/bin/cuda_rust_analyzer.rs"

[[bin]]
name = "cuda_toolchain_build"
path = "src/bin/cuda_toolchain_build.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "visit-mut", "parsing"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
serde_json = "1.0"
